name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chakshu
          POSTGRES_PASSWORD: chakshu
          POSTGRES_DB: chakshu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chakshu" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CHAKSHU_DATABASE_URL: postgresql+asyncpg://chakshu:chakshu@localhost:5432/chakshu
      CHAKSHU_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
