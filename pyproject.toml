[project]
name = "chakshu"
version = "0.1.0.dev0"
description = "Self-hosted AI pull request reviewer for GitHub"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Havelin Labs" }]
dependencies = [
  "fastapi>=0.150,<1",
  "uvicorn[standard]>=0.40,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "cryptography>=44",
  # 0.16 speaks REST API 2026-03-10, where a workflow dispatch returns the run it started.
  "githubkit[auth-app]>=0.16,<1",
  "httpx>=0.28,<1",
  "pyjwt[crypto]>=2.10,<3",
  "itsdangerous>=2.2,<3",
  "pyyaml>=6.0,<7",
  "pathspec>=0.12,<1",
  "claude-agent-sdk>=0.2.150,<0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "ruff>=0.9",
]

[project.scripts]
chakshu = "chakshu.cli:main"

[project.urls]
Homepage = "https://chakshu.havelin.in"
Documentation = "https://chakshu.havelin.in/docs"
Source = "https://github.com/havelin-labs/chakshu"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chakshu"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run, so the cached DB engine isn't shared across loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
