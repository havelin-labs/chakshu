[project]
name = "chakshu"
version = "0.1.0.dev0"
description = "Self-hosted AI pull request reviewer for GitHub"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Havelin Labs" }]
dependencies = [
  "fastapi>=0.150,<1",
  "uvicorn[standard]>=0.40,<1",
  "pydantic-settings>=2.10,<3",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "ruff>=0.9",
]

[project.scripts]
chakshu = "chakshu.cli:main"

[project.urls]
Homepage = "https://chakshu.havelin.in"
Documentation = "https://chakshu.havelin.in/docs"
Source = "https://github.com/havelin-labs/chakshu"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chakshu"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
