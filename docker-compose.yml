name: chakshu

x-app: &app
  build:
    context: .
    target: runtime
  image: ghcr.io/havelin-labs/chakshu:${CHAKSHU_VERSION:-dev}
  restart: unless-stopped
  env_file: .env
  environment:
    CHAKSHU_DATABASE_URL: postgresql+asyncpg://chakshu:${POSTGRES_PASSWORD}@db:5432/chakshu
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chakshu
      POSTGRES_DB: chakshu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chakshu -d chakshu"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"

  web:
    <<: *app
    command: ["web"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${CHAKSHU_PORT:-8000}:8000"

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "chakshu", "worker-health"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  # Local installs only: forwards GitHub webhooks from a smee.io channel to web.
  #   CHAKSHU_WEBHOOK_URL=https://smee.io/<channel> in .env, then: docker compose --profile smee up -d
  smee:
    profiles: ["smee"]
    image: node:22-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - npx --yes smee-client@2 --url "$$CHAKSHU_WEBHOOK_URL" --target http://web:8000/webhooks/github
    environment:
      # Plain default: compose interpolates every service, even ones whose profile is off.
      CHAKSHU_WEBHOOK_URL: ${CHAKSHU_WEBHOOK_URL:-}
    depends_on:
      web:
        condition: service_healthy

  # Local installs only: a Cloudflare quick tunnel, so GitHub Actions runners can reach web.
  #   docker compose --profile tunnel up -d, then find the https://<random>.trycloudflare.com URL with
  #   docker compose logs tunnel, set CHAKSHU_RUNNER_URL to it in .env and run docker compose up -d web worker.
  # The URL changes every time the tunnel restarts.
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:8000"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
